<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ECCYB | Staking</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch"><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('ua')">UA</button></div>
    <header><h1>ECCYB Staking</h1></header>
    <nav>
        <a href="index.html" data-i18n="home">Home</a>
        <a href="staking.html" data-i18n="stake">Staking</a>
        <a href="transfer.html" data-i18n="wallet">Transfer</a>
        <a href="admin.html" class="admin-only" data-i18n="admin" style="display:none; color:red;">Admin</a>
    </nav>
    <div class="panel">
        <h3 data-i18n="stakeTitle">Deposit Assets</h3>
        <input type="number" id="sAmt" placeholder="Amount">
        <input type="number" id="sDays" placeholder="Days">
        <button data-i18n="btnStake" onclick="stakeNow()">Stake Tokens</button>
    </div>
    <div class="panel">
        <h3 data-i18n="withdrawTitle">Withdrawal</h3>
        <button class="btn-outline" data-i18n="btnClaim" onclick="handleTx(stakingContract.withdraw())">Claim</button>
        <button class="btn-danger" data-i18n="btnEarly" onclick="early()">Early</button>
    </div>
    <div id="console"></div>
</div>
<script src="app.js"></script>
<script>
    async function stakeNow() {
        const amt = ethers.parseUnits(document.getElementById('sAmt').value, 18);
        const days = document.getElementById('sDays').value;
        log("Approving...");
        const tx = await tokenContract.approve(STAKING_ADDR, amt);
        await tx.wait();
        handleTx(stakingContract.stake(amt, days));
    }
    function early() { if(confirm(i18n[currentLang].confirmEarly)) handleTx(stakingContract.earlyWithdraw()); }
</script>
</body>
</html>
