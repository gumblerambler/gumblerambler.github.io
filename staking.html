<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ECCYB | Staking</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch"><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('ua')">UA</button></div>
    <header><h1>Staking</h1></header>
    <div id="authSection" style="text-align: center; padding: 40px;"><button onclick="connect()" data-i18n="connBtn">Connect</button></div>
    <nav id="mainNav" style="display:none;">
        <a href="index.html" data-i18n="home">Home</a><a href="staking.html" data-i18n="stake">Staking</a><a href="transfer.html" data-i18n="wallet">Transfer</a>
        <a href="admin.html" class="admin-only" data-i18n="admin" style="display:none; color:red;">Admin</a>
        <a href="#" onclick="logout(); return false;" data-i18n="logout" style="color:#666;">Logout</a>
    </nav>
    <div id="dataSection" style="display:none;">
        <div class="status-bar">
            <div class="status-item">
                <strong data-i18n="bal">Token</strong>: <span id="eccybStat">--</span>
            </div>
            <div class="status-item">
                <strong data-i18n="capital">Capital</strong>: <span id="dbCapital">0.00</span>
            </div>
            <div class="status-item">
                <strong data-i18n="gas">Gas</strong>: <span id="gasBalance">-- BTT</span>
            </div>
            <div class="status-item">
                <strong>Network</strong>: <span style="color: #2a9d8f;">BTTC</span>
            </div>
        </div>
        <div class="panel">
            <h3 data-i18n="stakeTitle">Deposit</h3>
            <input type="number" id="sAmt" placeholder="Amount (ECCYB)">
            <input type="number" id="sDays" placeholder="Days">
            <button data-i18n="btnStake" onclick="stakeAction()">Stake</button>
        </div>
        <div class="panel">
            <h3 data-i18n="withdrawTitle">Withdraw</h3>
            <button class="btn-outline" data-i18n="btnClaim" onclick="handleTx(stakingContract.withdraw())">Claim</button>
            <button class="btn-danger" data-i18n="btnEarly" onclick="handleTx(stakingContract.earlyWithdraw())">Early Exit</button>
        </div>
    </div>
    <div id="console"></div>
</div>
<script src="app.js"></script>
<script>
    async function stakeAction() {
        const amt = ethers.parseUnits(document.getElementById('sAmt').value, 18);
        const days = document.getElementById('sDays').value;
        log("Approving..."); 
        const tx = await tokenContract.approve(STAKING_ADDR, amt); 
        await tx.wait();
        handleTx(stakingContract.stake(amt, days));
    }
</script>
</body>
</html>
