<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ECCYB | Transfer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch"><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('ua')">UA</button></div>
    <header><h1>ECCYB Wallet</h1></header>
    <nav>
        <a href="index.html" data-i18n="home">Home</a>
        <a href="staking.html" data-i18n="stake">Staking</a>
        <a href="transfer.html" data-i18n="wallet">Transfer</a>
        <a href="admin.html" class="admin-only" data-i18n="admin" style="display:none; color:red;">Admin</a>
    </nav>
    <div class="panel">
        <h3 data-i18n="wallet">Transfer Assets</h3>
        <input type="text" id="tTo" placeholder="Recipient 0x...">
        <input type="number" id="tAmt" placeholder="Amount">
        <button data-i18n="btnSend" onclick="handleTx(tokenContract.transfer(document.getElementById('tTo').value, ethers.parseUnits(document.getElementById('tAmt').value, 18)))">Send</button>
    </div>
    <div id="console"></div>
</div>
<script src="app.js"></script>
</body>
</html>
