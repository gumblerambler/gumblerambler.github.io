<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <title>ECCYB | Gomoku Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        #gameBoard { 
            display: grid; 
            grid-template-columns: repeat(15, 25px); 
            grid-template-rows: repeat(15, 25px); 
            gap: 1px; 
            background: var(--u-border); 
            border: 2px solid var(--u-blue); 
            margin: 20px auto; 
            width: max-content; 
        }
        .cell { 
            width: 25px; height: 25px; background: #fff; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
        }
        /* Стилі для фішок (Чорні - гравець, Білі - бот) */
        .cell.black::after { content: ""; width: 18px; height: 18px; background: #000; border-radius: 50%; }
        .cell.white::after { content: ""; width: 18px; height: 18px; background: #fff; border: 1px solid #000; border-radius: 50%; }
        
        #gameStatus { text-align: center; font-weight: bold; margin: 10px 0; min-height: 1.2em; color: var(--u-blue); }
        .game-panel { text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ua')">UA</button>
    </div>

    <header><h1>Gomoku Game</h1></header>

    <div id="authSection" style="text-align: center; padding: 40px;">
        <button onclick="connect()" data-i18n="connBtn">Connect MetaMask</button>
    </div>

    <nav id="mainNav" style="display:none;">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="staking.html" data-i18n="stake">Staking</a>
        <a href="transfer.html" data-i18n="wallet">Transfer</a>
        <a href="game.html" style="font-weight:bold; color:var(--u-blue);">Gomoku</a>
        <a href="#" onclick="logout(); return false;" data-i18n="logout" style="color:#666;">Logout</a>
    </nav>

    <div id="dataSection" style="display:none;">
        <div class="status-bar">
            <div class="status-item"><strong data-i18n="bal">Token</strong>: <span id="eccybStat">--</span></div>
            <div class="status-item"><strong data-i18n="capital">Capital</strong>: <span id="dbCapital">0.00</span></div>
            <div class="status-item"><strong>Network</strong>: <span style="color: #2a9d8f;">BTTC</span></div>
        </div>

        <div class="panel game-panel">
            <div id="gameStatus" data-i18n="game_welcome">Stake 1 ECCYB to start!</div>
            <button id="startBtn" onclick="payAndStart()" data-i18n="btn_start">Start New Game</button>
            <div id="gameBoard" style="display: none;"></div>
        </div>
    </div>

    <div id="console"></div>
</div>

<script src="app.js"></script>
<script>
    // Додаємо переклади для гри в об'єкт i18n
    Object.assign(i18n.en, {
        game_welcome: "Stake 1 ECCYB to play and win 2!",
        btn_start: "Start Game (1 ECCYB)",
        your_turn: "Your turn",
        bot_thinking: "Bot is thinking...",
        win_msg: "Victory! +2.00 Capital added!",
        lose_msg: "Bot won. Try again!",
        game_err: "Error communicating with server"
    });
    Object.assign(i18n.ua, {
        game_welcome: "Ставка 1 ECCYB. Перемога принесе 2!",
        btn_start: "Почати гру (1 ECCYB)",
        your_turn: "Ваш хід",
        bot_thinking: "Бот думає...",
        win_msg: "Перемога! +2.00 до Капіталу!",
        lose_msg: "Бот переміг. Спробуйте ще раз!",
        game_err: "Помилка зв'язку з сервером"
    });

    let gameActive = false;

    // Функція оплати та запуску гри на сервері
    async function payAndStart() {
        try {
            log(i18n[currentLang].wait);
            
            // 1. Оплата токеном (Транзакція в блокчейні)
            const amt = ethers.parseUnits("1", 18);
            const tx = await tokenContract.transfer(OWNER_ADDR, amt);
            await tx.wait(); // Чекаємо підтвердження
            
            log("Payment confirmed. Initializing server...");

            // 2. Створення гри в БД через PHP
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    action: 'game_start', 
                    address: userAddress 
                })
            });
            const res = await resp.json();

            if (res.status === "success") {
                gameActive = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('gameBoard').style.display = 'grid';
                document.getElementById('gameStatus').innerText = i18n[currentLang].your_turn;
                // Малюємо порожнє поле 15x15
                renderBoard(Array(15).fill().map(() => Array(15).fill(null)));
            }
        } catch (e) {
            log("Error: " + e.message);
        }
    }

    async function makeMove(r, c) {
        if (!gameActive) return;
    
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'game_move', address: userAddress, row: r, col: c })
            });
            const res = await resp.json();
    
            // ОНОВЛЮЄМО ПОЛЕ ГРИ (візуально)
            renderBoard(res.board);
    
            if (res.status === "victory" || res.status === "defeat") {
                gameActive = false; // Зупиняємо гру
                
                // Визначаємо повідомлення
                const msg = res.status === "victory" ? i18n[currentLang].win_msg : i18n[currentLang].lose_msg;
                
                // Оновлюємо статусний текст
                document.getElementById('gameStatus').innerText = msg;
                
                // Показуємо кнопку початку нової гри
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').innerText = i18n[currentLang].btn_start;
    
                // --- ПРИМУСОВЕ ОНОВЛЕННЯ КАПІТАЛУ ---
                // Чекаємо 500мс, щоб база даних встигла обробити запит
                setTimeout(async () => {
                    await syncData(); // Ця функція має бути в app.js
                    
                    // Якщо після syncData капітал все ще старий, спробуємо пряме оновлення:
                    if (res.status === "victory") {
                        await updateDBCapitalDirectly();
                    }
                }, 500);
                
                alert(msg);
            }
        } catch (e) {
            log("Error: " + e.message);
        }
    }

    function renderBoard(board) {
        const grid = document.getElementById('gameBoard');
        grid.innerHTML = '';
        for (let r = 0; r < 15; r++) {
            for (let c = 0; c < 15; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (board[r][c] === 'B') cell.classList.add('black'); // Гравець
                if (board[r][c] === 'W') cell.classList.add('white'); // Бот
                cell.onclick = () => makeMove(r, c);
                grid.appendChild(cell);
            }
        }
    }

async function handleFinish(msg) {
    gameActive = false;
    document.getElementById('gameStatus').innerText = msg;
    document.getElementById('startBtn').style.display = 'block';
    
    alert(msg);

    // Безпечне оновлення без блокування сторінки
    try {
        log("Синхронізація даних...");
        // Викликаємо функцію з app.js, якщо вона є
        if (typeof syncData === "function") {
            await syncData(); 
        } else {
            // Якщо syncData немає, просто перезавантажимо дані користувача
            await updateDBCapitalDirectly(); 
        }
    } catch (e) {
        console.warn("Дані не оновлено автоматично, але гра завершена.");
    }
}

    // Оновлення мови при зміні (якщо викликається setLang з app.js)
    const originalSetLang = window.setLang;
    window.setLang = (l) => {
        if(originalSetLang) originalSetLang(l);
        updateUI(); // Ваша стандартна функція з app.js
    };
</script>
</body>
</html>
