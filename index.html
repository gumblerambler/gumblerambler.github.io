<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB - Панель Управління Балами</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --danger: #d93025; --success: #188038; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #333; }
        .dashboard { background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 30px; text-align: center; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 25px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3); }
        .status-bar { font-size: 0.85em; color: #666; margin-bottom: 15px; word-break: break-all; font-family: monospace; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 1rem; }
        button:active { transform: scale(0.98); }
        #connectBtn { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        #disconnectBtn { background: #6c757d; color: white; font-size: 0.8em; padding: 8px 15px; }
        .admin-panel { background: #fff4f4; border: 1px solid #ffe2e2; padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; }
        #console { background: #222; color: #0f0; padding: 12px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 0.75em; text-align: left; height: 100px; overflow-y: auto; margin-top: 20px; line-height: 1.4; }
        .label { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div style="text-align: left;">
            <h2 style="margin:0; color: var(--primary);">ECCYB</h2>
            <span style="font-size: 0.75em; color: #888;">ZIEIT Digital Economy System</span>
        </div>
        <button id="disconnectBtn" style="display:none;">Вийти</button>
    </div>

    <div id="status" class="status-bar">Очікування підключення...</div>

    <div class="balance-box">
        <div class="label">Ваш поточний баланс</div>
        <div id="userBalance" style="font-size: 2.5em; font-weight: bold;">-- ECCYB</div>
    </div>

    <button id="connectBtn">Увійти через MetaMask</button>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <strong style="color: var(--danger); display: block; margin-bottom: 10px;">⚒ Перерахування балів (Transfer)</strong>
        <label style="font-size: 0.85em;">Адреса студента:</label>
        <input type="text" id="studentAddr" placeholder="0x...">
        <label style="font-size: 0.85em;">Кількість балів:</label>
        <input type="number" id="sendAmount" placeholder="Введіть суму">
        <button id="sendBtn" style="background: var(--success); color: white; width: 100%; margin-top: 10px;">Відправити бали</button>
    </div>

    <div id="console">Система готова до роботи.</div>
</div>

<script>
    // Константи проекту
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    
    // ABI для стандартних функцій ERC-20
    const ECCYB_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) public returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let signer, contract, userAddress;

    const log = (msg) => {
        const c = document.getElementById('console');
        const time = new Date().toLocaleTimeString();
        c.innerHTML += `<br>[${time}] ${msg}`;
        c.scrollTop = c.scrollHeight;
        console.log(msg);
    };

    // Функція підключення
    async function connect() {
        if (!window.ethereum) {
            alert("MetaMask не знайдено! Встановіть розширення для роботи.");
            return;
        }
        
        try {
            log("Запит на авторизацію...");
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];

            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDR, ECCYB_ABI, signer);

            // Оновлення інтерфейсу
            document.getElementById('status').innerText = `ID: ${userAddress}`;
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('disconnectBtn').style.display = 'block';

            // Перевірка прав адміністратора (Owner)
            if (userAddress.toLowerCase() === OWNER_ADDR.toLowerCase()) {
                document.getElementById('adminPanel').style.display = 'block';
                log("Адміністративний доступ підтверджено.");
            }

            await updateBalance();
            log("Дані успішно синхронізовано з BTTC.");

        } catch (e) {
            log("Помилка підключення: " + e.message);
        }
    }

    // Оновлення балансу (цілі числа)
    async function updateBalance() {
        try {
            const bal = await contract.balanceOf(userAddress);
            const decimals = await contract.decimals();
            // Відкидаємо дрібну частину для охайності
            const formattedBalance = Math.floor(Number(ethers.formatUnits(bal, decimals)));
            document.getElementById('userBalance').innerText = `${formattedBalance} ECCYB`;
        } catch (e) {
            log("Не вдалося отримати баланс.");
        }
    }

    // Функція перерахування (Transfer)
    async function handleTransfer() {
        const to = document.getElementById('studentAddr').value;
        const amt = document.getElementById('sendAmount').value;

        if (!ethers.isAddress(to)) return alert("Некоректна адреса студента!");
        if (!amt || amt <= 0) return alert("Введіть коректну кількість балів!");

        try {
            log(`Ініціалізація переказу ${amt} ECCYB...`);
            const decimals = await contract.decimals();
            const tx = await contract.transfer(to, ethers.parseUnits(amt, decimals));
            
            log(`Транзакція відправлена: ${tx.hash.substring(0, 15)}...`);
            
            // Очікування підтвердження мережею
            await tx.wait();
            
            log("Успішно підтверджено в блокчейні!");
            alert(`Студенту успішно перераховано ${amt} ECCYB!`);
            
            // Очищення полів та оновлення балансу
            document.getElementById('studentAddr').value = "";
            document.getElementById('sendAmount').value = "";
            await updateBalance();
            
        } catch (e) {
            log("Помилка транзакції: " + e.message);
            if (e.message.includes("insufficient funds")) {
                alert("Недостатньо токенів на вашому балансі для переказу.");
            }
        }
    }

    // Функція відключення (скидання інтерфейсу)
    function disconnect() {
        signer = null;
        contract = null;
        userAddress = null;
        document.getElementById('status').innerText = "Очікування підключення...";
        document.getElementById('userBalance').innerText = "-- ECCYB";
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('disconnectBtn').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        log("Сесію закрито.");
    }

    // Прив'язка подій до кнопок
    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('disconnectBtn').onclick = disconnect;
    document.getElementById('sendBtn').onclick = handleTransfer;

</script>

</body>
</html>
