<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB Project | IT Dept ZIEIT</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --u-blue: #003366;
            --u-text: #2c3e50;
            --u-bg: #f4f4f2;
            --u-white: #ffffff;
            --u-border: #d1d1d1;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--u-bg);
            color: var(--u-text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--u-white);
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border: 1px solid var(--u-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .lang-btn {
            background: none;
            border: 1px solid var(--u-blue);
            color: var(--u-blue);
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .lang-btn.active {
            background: var(--u-blue);
            color: white;
        }

        header {
            text-align: center;
            border-bottom: 2px double var(--u-blue);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 { font-size: 1.8rem; margin: 0; color: var(--u-blue); text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-style: italic; font-size: 0.9rem; color: #666; }

        .balance-card {
            background: var(--u-bg);
            border: 1px solid var(--u-border);
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        #userBalance { font-size: 2.2rem; color: var(--u-blue); margin: 10px 0; }

        .panel { text-align: left; margin-top: 30px; padding: 20px; border: 1px solid var(--u-border); }
        h3 { font-size: 1.1rem; border-bottom: 1px solid var(--u-blue); padding-bottom: 5px; margin-bottom: 15px; color: var(--u-blue); }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--u-border); font-family: 'Courier New', monospace; box-sizing: border-box; }

        button.main-btn {
            background-color: var(--u-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-outline { background: transparent; color: var(--u-blue); border: 1px solid var(--u-blue); width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }
        .btn-danger { background-color: transparent; color: #a4161a; border: 1px solid #a4161a; width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }

        #console {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            height: 120px;
            overflow-y: auto;
            margin-top: 30px;
            border-radius: 4px;
        }

        .note { font-size: 0.75rem; color: #7f8c8d; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ua" onclick="setLang('ua')">UA</button>
    </div>

    <header>
        <h1 data-key="title">ECCYB Project</h1>
        <div class="subtitle" data-key="subtitle">IT Department | ZIEIT</div>
    </header>

    <div id="authSection">
        <button class="main-btn" id="connectBtn" data-key="connectBtn">Initialize Session (MetaMask)</button>
    </div>

    <div id="mainUI" style="display:none;">
        <div class="balance-card">
            <div id="accountType" data-key="accType" style="font-size: 0.7rem; font-weight: bold; color: #777;">ACCOUNT TYPE</div>
            <div id="userBalance">-- ECCYB</div>
            <div id="userAddr" style="font-size: 0.7rem; font-family: monospace; color: #999;"></div>
        </div>

        <div class="panel">
            <h3 data-key="stakingTitle">ECCYB Staking Management</h3>
            <div class="input-group">
                <label data-key="labelAmt">Amount to Stake</label>
                <input type="number" id="stakeAmount" placeholder="0.00">
            </div>
            <div class="input-group">
                <label data-key="labelDays">Term (Days)</label>
                <input type="number" id="stakeDays" placeholder="e.g. 7">
            </div>
            <button class="main-btn" id="stakeBtn" data-key="stakeBtn">Deposit Assets</button>
            <div style="margin-top: 20px; border-top: 1px dashed var(--u-border); padding-top: 15px;">
                <button class="btn-outline" id="withdrawBtn" data-key="withdrawBtn">Claim Deposit + Bonus</button>
                <button class="btn-danger" id="earlyWithdrawBtn" data-key="earlyWithdrawBtn">Early Withdrawal (Lose Bonus)</button>
                <p class="note" data-key="earlyNote">* Early withdrawal returns only the principal amount.</p>
            </div>
        </div>

        <div id="adminPanel" class="panel" style="display:none; border-color: #a3c1ad;">
            <h3 data-key="adminTitle">Treasury Control (Administrator)</h3>
            <div class="input-group">
                <label data-key="labelApprove">Authorize Payouts (Allowance)</label>
                <input type="number" id="approveAmt" placeholder="Amount">
                <button class="main-btn" id="approveBtn" data-key="approveBtn">Approve Contract</button>
            </div>
        </div>

        <button class="btn-outline" id="disconnectBtn" data-key="exitBtn">Terminate Session</button>
    </div>

    <div id="console" data-key="consoleInit">System awaiting blockchain connection...</div>
</div>

<script>
    const TOKEN_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const STAKING_ADDR = "0x440C907485cb68B3A708EcC3d0E93d121bF6dAeb"; // Вставити після деплою
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    
    const i18n = {
        en: {
            title: "ECCYB Project",
            subtitle: "IT Department | ZIEIT University",
            connectBtn: "Initialize Session (MetaMask)",
            accType: "ACCOUNT TYPE",
            accAdmin: "TREASURY ADMINISTRATOR",
            accStudent: "STUDENT ACCOUNT",
            stakingTitle: "ECCYB Staking Management",
            labelAmt: "Token Amount",
            labelDays: "Term (Days)",
            stakeBtn: "Deposit Assets",
            withdrawBtn: "Claim Deposit + Bonus",
            earlyWithdrawBtn: "Early Withdrawal (Lose Bonus)",
            earlyNote: "* Early withdrawal returns only the principal amount.",
            adminTitle: "Treasury Control (Administrator)",
            labelApprove: "Authorize Payouts (Allowance)",
            approveBtn: "Approve Contract",
            exitBtn: "Terminate Session",
            consoleInit: "System awaiting blockchain connection...",
            logConn: "Session initialized for ",
            logWait: "Processing transaction...",
            logSuccess: "Transaction confirmed.",
            viewScan: "View on BTTScan"
        },
        ua: {
            title: "Проєкт ECCYB",
            subtitle: "Кафедра ІТ | ЗІЕІТ",
            connectBtn: "Ініціалізувати сесію (MetaMask)",
            accType: "ТИП ОБЛІКОВОГО ЗАПИСУ",
            accAdmin: "АДМІНІСТРАТОР КАЗНАЧЕЙСТВА",
            accStudent: "СТУДЕНТСЬКИЙ РАХУНОК",
            stakingTitle: "Керування стейкінгом ECCYB",
            labelAmt: "Кількість токенів",
            labelDays: "Термін (днів)",
            stakeBtn: "Внести активи",
            withdrawBtn: "Забрати депозит + бонус",
            earlyWithdrawBtn: "Дострокове розірвання (без бонусу)",
            earlyNote: "* При достроковому виводі бонус 10% втрачається.",
            adminTitle: "Керування казначейством (Адмін)",
            labelApprove: "Ліміт виплат (Allowance)",
            approveBtn: "Надати дозвіл контракту",
            exitBtn: "Завершити сесію",
            consoleInit: "Система очікує підключення...",
            logConn: "Сесію ініціалізовано для ",
            logWait: "Транзакція в обробці...",
            logSuccess: "Транзакцію підтверджено.",
            viewScan: "Переглянути в BTTScan"
        }
    };

    let currentLang = 'en'; 
    let signer, tokenContract, stakingContract, userAddress;

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (i18n[lang][key]) el.innerText = i18n[lang][key];
        });
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-ua').classList.toggle('active', lang === 'ua');
    }

    const log = (msgKey, hash = null) => {
        const c = document.getElementById('console');
        const msg = i18n[currentLang][msgKey] || msgKey;
        let html = `> ${msg}`;
        if (hash) {
            html += ` <br><small>TX: <a href="https://bttcscan.com/tx/${hash}" target="_blank" style="color: #a3c1ad;">${i18n[currentLang].viewScan}</a></small>`;
        }
        c.innerHTML = html + `<br>` + c.innerHTML;
    };

    async function syncData() {
        const bal = await tokenContract.balanceOf(userAddress);
        document.getElementById('userBalance').innerText = `${parseFloat(ethers.formatUnits(bal, 18)).toFixed(2)} ECCYB`;
    }

    async function connect() {
        if (!window.ethereum) return alert("MetaMask not found");
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();

            tokenContract = new ethers.Contract(TOKEN_ADDR, [
                "function balanceOf(address) view returns (uint256)",
                "function approve(address, uint256) returns (bool)"
            ], signer);

            stakingContract = new ethers.Contract(STAKING_ADDR, [
                "function stake(uint256, uint256) external",
                "function withdraw() external",
                "function earlyWithdraw() external"
            ], signer);

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainUI').style.display = 'block';
            document.getElementById('userAddr').innerText = userAddress;

            const isAdmin = userAddress.toLowerCase() === OWNER_ADDR.toLowerCase();
            document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('accountType').innerText = i18n[currentLang][isAdmin ? 'accAdmin' : 'accStudent'];

            await syncData();
            log(i18n[currentLang].logConn + userAddress.substring(0, 10) + "...");
        } catch (e) { log(e.message); }
    }

    async function runTx(contractObj, method, ...args) {
        try {
            log("logWait");
            const tx = await contractObj[method](...args);
            log("logWait", tx.hash);
            await tx.wait();
            log("logSuccess");
            await syncData();
        } catch (e) { log(e.message); }
    }

    document.getElementById('connectBtn').onclick = connect;

    document.getElementById('stakeBtn').onclick = async () => {
        const amt = document.getElementById('stakeAmount').value;
        const days = document.getElementById('stakeDays').value;
        if (amt && days) {
            // Крок 1: Approve для контракту стейкінгу
            log("Step 1/2: Approving transfer...");
            const tx1 = await tokenContract.approve(STAKING_ADDR, ethers.parseUnits(amt, 18));
            await tx1.wait();
            // Крок 2: Сам стейкінг
            log("Step 2/2: Staking assets...");
            await runTx(stakingContract, 'stake', ethers.parseUnits(amt, 18), days);
        }
    };

    document.getElementById('withdrawBtn').onclick = () => runTx(stakingContract, 'withdraw');
    document.getElementById('earlyWithdrawBtn').onclick = () => runTx(stakingContract, 'earlyWithdraw');
    
    document.getElementById('approveBtn').onclick = () => {
        const amt = document.getElementById('approveAmt').value;
        if (amt) runTx(tokenContract, 'approve', STAKING_ADDR, ethers.parseUnits(amt, 18));
    };

    document.getElementById('disconnectBtn').onclick = () => location.reload();
    setLang('en');
</script>
</body>
</html>
