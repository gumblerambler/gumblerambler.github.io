<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>ECCYB | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ua')">UA</button>
    </div>
    <header><h1>ECCYB Project</h1></header>

    <div id="authSection" style="text-align:center; padding:40px;">
        <button onclick="connect()" data-i18n="connBtn">Connect MetaMask</button>
    </div>

    <nav id="mainNav" style="display:none;">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="staking.html" data-i18n="stake">Staking</a>
        <a href="transfer.html" data-i18n="wallet">Transfer</a>
        <a href="admin.html" class="admin-only" data-i18n="admin" style="display:none; color:red;">Admin</a>
        <a href="#" onclick="logout(); return false;" data-i18n="logout" style="color:#666; margin-left:10px;">Logout</a>
    </nav>

    <div id="dataSection" style="display:none;">
        <div class="status-bar">
            <div class="status-item"><strong data-i18n="bal">Token</strong>: <span id="eccybStat">--</span>ECCYB</div>
            <div class="status-item"><strong data-i18n="gas">Gas</strong>: <span id="gasBalance">--</span></div>
            <div class="status-item"><strong>Net</strong>: BTTC</div>
        </div>

        <div class="panel">
            <h3 data-i18n="titleStake">Staking System</h3>
            <p style="font-size:0.85rem; color: #555;" data-i18n="infoStake"></p>
        </div>

        <div class="panel">
            <h3 data-i18n="titleTrans">Asset Transfers</h3>
            <p style="font-size:0.85rem; color: #555;" data-i18n="infoTrans"></p>
        </div>

        <div class="panel admin-only">
            <h3 data-i18n="titleAdmin">Administrative Tools</h3>
            <p style="font-size:0.85rem; color: #555;" data-i18n="infoAdmin"></p>
        </div>
    </div>
    <div id="console">System ready...</div>
</div>
<script src="app.js"></script>
</body>
</html>
