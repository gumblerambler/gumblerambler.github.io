<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB Project | IT Dept ZIEIT</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --u-blue: #003366;
            --u-text: #2c3e50;
            --u-bg: #f4f4f2;
            --u-white: #ffffff;
            --u-border: #d1d1d1;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--u-bg);
            color: var(--u-text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--u-white);
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border: 1px solid var(--u-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .lang-btn {
            background: none;
            border: 1px solid var(--u-blue);
            color: var(--u-blue);
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .lang-btn.active {
            background: var(--u-blue);
            color: white;
        }

        header {
            text-align: center;
            border-bottom: 2px double var(--u-blue);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 { font-size: 1.8rem; margin: 0; color: var(--u-blue); text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-style: italic; font-size: 0.9rem; color: #666; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .status-item {
            flex: 1;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid var(--u-border);
        }
        .status-label { display: block; color: #666; font-weight: bold; margin-bottom: 3px; text-transform: uppercase; }
        .status-value { font-family: 'Courier New', monospace; color: var(--u-blue); }
        .gas-low { color: #a4161a; font-weight: bold; }
        .gas-ok { color: #28a745; }

        .balance-card {
            background: var(--u-bg);
            border: 1px solid var(--u-border);
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        #userBalance { font-size: 2.2rem; color: var(--u-blue); margin: 10px 0; }

        .panel { text-align: left; margin-top: 30px; padding: 20px; border: 1px solid var(--u-border); }
        h3 { font-size: 1.1rem; border-bottom: 1px solid var(--u-blue); padding-bottom: 5px; margin-bottom: 15px; color: var(--u-blue); }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--u-border); font-family: 'Courier New', monospace; box-sizing: border-box; }

        button.main-btn {
            background-color: var(--u-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-outline { background: transparent; color: var(--u-blue); border: 1px solid var(--u-blue); width: 100%; padding: 10px; cursor: pointer; margin-top: 5px; }
        .btn-burn { background-color: #5d0000; color: white; border: none; width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }
        .btn-danger { background-color: transparent; color: #a4161a; border: 1px solid #a4161a; width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }

        #console {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            height: 120px;
            overflow-y: auto;
            margin-top: 30px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ua" onclick="setLang('ua')">UA</button>
    </div>

    <header>
        <h1 data-key="title">ECCYB Project</h1>
        <div class="subtitle" data-key="subtitle">IT Department | ZIEIT University</div>
    </header>

    <div id="authSection">
        <button class="main-btn" id="connectBtn" data-key="connectBtn">Initialize Session (MetaMask)</button>
    </div>

    <div id="mainUI" style="display:none;">
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label" data-key="gasStatus">GAS BALANCE (BTT)</span>
                <span id="gasBalance" class="status-value">-- BTT</span>
            </div>
            <div class="status-item">
                <span class="status-label" data-key="netStatus">NETWORK</span>
                <span id="netStatus" class="status-value">Checking...</span>
            </div>
        </div>

        <div class="balance-card">
            <div id="accountType" data-key="accType" style="font-size: 0.7rem; font-weight: bold; color: #777;">ACCOUNT TYPE</div>
            <div id="userBalance">-- ECCYB</div>
            <div id="userAddr" style="font-size: 0.7rem; font-family: monospace; color: #999;"></div>
        </div>

        <div class="panel">
            <h3 data-key="transferTitle">Internal Asset Transfer</h3>
            <div class="input-group">
                <label data-key="labelAddr">Recipient Address</label>
                <input type="text" id="targetAddr" placeholder="0x...">
            </div>
            <div class="input-group">
                <label data-key="labelAmt">Token Amount</label>
                <input type="number" id="targetAmount" placeholder="0.00">
            </div>
            <button class="main-btn" id="sendBtn" data-key="sendBtn">Execute Transaction</button>
        </div>

        <div class="panel">
            <h3 data-key="stakingTitle">ECCYB Staking Management</h3>
            <div class="input-group">
                <label data-key="labelStakeAmt">Amount to Stake</label>
                <input type="number" id="stakeAmount" placeholder="0.00">
            </div>
            <div class="input-group">
                <label data-key="labelDays">Term (Days)</label>
                <input type="number" id="stakeDays" placeholder="e.g. 7">
            </div>
            <button class="main-btn" id="stakeBtn" data-key="stakeBtn">Deposit Assets</button>
            <div style="margin-top: 15px; border-top: 1px dashed var(--u-border); padding-top: 10px;">
                <button class="btn-outline" id="withdrawBtn" data-key="withdrawBtn">Claim Deposit + Bonus</button>
                <button class="btn-danger" id="earlyWithdrawBtn" data-key="earlyWithdrawBtn">Early Withdrawal (No Bonus)</button>
            </div>
        </div>

        <div id="adminPanel" class="panel" style="display:none; border-color: #a3c1ad;">
            <h3 data-key="adminTitle">Emission & Treasury Control</h3>
            <div class="input-group">
                <label data-key="labelMint">Minting Volume</label>
                <input type="number" id="mintAmount" placeholder="Amount">
                <button class="btn-outline" id="mintBtn" data-key="mintBtn">Activate Emission</button>
            </div>
            
            <div style="margin-top:20px; padding-top:15px; border-top: 1px solid #eee;">
                <label style="color: #a4161a;" data-key="labelGasGift">Gas Support (Transfer BTT to Student)</label>
                <div class="input-group">
                    <input type="text" id="gasTargetAddr" placeholder="Student Address 0x...">
                    <input type="number" id="gasGiftAmount" placeholder="BTT Amount (e.g. 500)" style="margin-top:5px;">
                    <button class="btn-outline" id="sendGasBtn" style="border-color: #a4161a; color: #a4161a;" data-key="sendGasBtn">Send Gas (BTT)</button>
                </div>
            </div>

            <div class="input-group" style="margin-top:15px; border-top: 1px solid #eee; padding-top: 10px;">
                <label data-key="labelApprove">Authorize Staking Payouts (Allowance)</label>
                <input type="number" id="approveAmt" placeholder="Amount">
                <button class="main-btn" id="approveBtn" style="background-color: #2c3e50;" data-key="approveBtn">Set Treasury Allowance</button>
            </div>
            
            <div class="input-group" style="margin-top:15px;">
                <label data-key="labelBurn">Asset Destruction (Burn)</label>
                <input type="number" id="burnAmount" placeholder="Amount">
                <button class="btn-burn" id="burnBtn" data-key="burnBtn">Burn Tokens</button>
            </div>
        </div>

        <button class="btn-outline" id="disconnectBtn" data-key="exitBtn" style="margin-top: 20px; border-color: #ccc; color: #999;">Terminate Session</button>
    </div>

    <div id="console" data-key="consoleInit">System awaiting blockchain connection...</div>
</div>

<script>
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const STAKING_ADDR = "0x440C907485cb68B3A708EcC3d0E93d121bF6dAeb"; // Потрібно замінити після деплою
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    
    const i18n = {
        en: {
            title: "ECCYB Project",
            subtitle: "IT Department | ZIEIT University",
            connectBtn: "Initialize Session (MetaMask)",
            gasStatus: "Gas Balance (BTT)",
            netStatus: "Network",
            accType: "ACCOUNT TYPE",
            accAdmin: "ADMINISTRATIVE ACCESS",
            accStudent: "STUDENT ACCESS",
            transferTitle: "Internal Asset Transfer",
            labelAddr: "Recipient Address",
            labelAmt: "Token Amount",
            labelStakeAmt: "Amount to Stake",
            labelDays: "Term (Days)",
            stakeBtn: "Deposit Assets",
            withdrawBtn: "Claim Deposit + Bonus",
            earlyWithdrawBtn: "Early Withdrawal (No Bonus)",
            sendBtn: "Execute Transaction",
            adminTitle: "Emission & Treasury Control",
            labelMint: "Minting Volume",
            mintBtn: "Activate Emission",
            labelGasGift: "Gas Support (Transfer BTT to Student)",
            sendGasBtn: "Send Gas (BTT)",
            labelBurn: "Asset Destruction (Burn)",
            burnBtn: "Burn Tokens",
            labelApprove: "Authorize Staking Payouts (Allowance)",
            approveBtn: "Set Treasury Allowance",
            exitBtn: "Terminate Session",
            consoleInit: "System awaiting blockchain connection...",
            logWait: "Transaction processing...",
            logSuccess: "Transaction confirmed.",
            viewScan: "View on BTTScan",
            logGasSent: "Gas transfer initiated..."
        },
        ua: {
            title: "Проєкт ECCYB",
            subtitle: "Кафедра ІТ | ЗІЕІТ",
            connectBtn: "Ініціалізувати сесію (MetaMask)",
            gasStatus: "Баланс газу (BTT)",
            netStatus: "Мережа",
            accType: "ТИП ОБЛІКОВОГО ЗАПИСУ",
            accAdmin: "АДМІНІСТРАТИВНИЙ ДОСТУП",
            accStudent: "СТУДЕНТСЬКИЙ ДОСТУП",
            transferTitle: "Внутрішній переказ активів",
            labelAddr: "Адреса отримувача",
            labelAmt: "Кількість токенів",
            labelStakeAmt: "Сума для стейкінгу",
            labelDays: "Термін (днів)",
            stakeBtn: "Внести активи",
            withdrawBtn: "Забрати депозит + бонус",
            earlyWithdrawBtn: "Дострокове розірвання (без бонусу)",
            sendBtn: "Виконати переказ",
            adminTitle: "Управління емісією та скарбницею",
            labelMint: "Обсяг емісії (Mint)",
            mintBtn: "Активувати емісію",
            labelGasGift: "Газова підтримка (Переказ BTT студенту)",
            sendGasBtn: "Надіслати Газ (BTT)",
            labelBurn: "Знищення токенів (Burn)",
            burnBtn: "Спалити активи",
            labelApprove: "Дозвіл на виплати стейкінгу",
            approveBtn: "Встановити ліміт скарбниці",
            exitBtn: "Завершити сесію",
            consoleInit: "Система очікує підключення...",
            logWait: "Транзакція в обробці...",
            logSuccess: "Транзакція підтверджена.",
            viewScan: "Переглянути в BTTScan",
            logGasSent: "Надсилання газу ініційовано..."
        }
    };

    let currentLang = 'en';
    let signer, contract, stakingContract, userAddress;

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (i18n[lang][key]) el.innerText = i18n[lang][key];
        });
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-ua').classList.toggle('active', lang === 'ua');
    }

    const log = (msgKey, hash = null) => {
        const c = document.getElementById('console');
        const msg = i18n[currentLang][msgKey] || msgKey;
        let html = `> ${msg}`;
        if (hash) {
            html += ` <br><small>TX: <a href="https://bttcscan.com/tx/${hash}" target="_blank" style="color: #a3c1ad;">${i18n[currentLang].viewScan}</a></small>`;
        }
        c.innerHTML = html + `<br>` + c.innerHTML;
        c.scrollTop = 0;
    };

    async function syncData() {
        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const bal = await contract.balanceOf(userAddress);
            document.getElementById('userBalance').innerText = `${Math.floor(Number(ethers.formatUnits(bal, 18)))} ECCYB`;

            const gasBalWei = await provider.getBalance(userAddress);
            const gasBal = parseFloat(ethers.formatEther(gasBalWei)).toFixed(2);
            const gasEl = document.getElementById('gasBalance');
            gasEl.innerText = `${gasBal} BTT`;
            gasEl.className = parseFloat(gasBal) < 50 ? "status-value gas-low" : "status-value gas-ok";

            const network = await provider.getNetwork();
            const netEl = document.getElementById('netStatus');
            netEl.innerText = network.chainId === 199n ? "BTTC Mainnet" : "Wrong Network";
            netEl.style.color = network.chainId === 199n ? "#28a745" : "#a4161a";
        } catch (e) { console.error(e); }
    }

    async function connect() {
        if (!window.ethereum) return alert("MetaMask not found");
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();

            contract = new ethers.Contract(CONTRACT_ADDR, [
                "function balanceOf(address) view returns (uint256)",
                "function transfer(address, uint256) public returns (bool)",
                "function approve(address, uint256) public returns (bool)",
                "function mint(address, uint256) public",
                "function burn(uint256) public"
            ], signer);

            stakingContract = new ethers.Contract(STAKING_ADDR, [
                "function stake(uint256, uint256) external",
                "function withdraw() external",
                "function earlyWithdraw() external"
            ], signer);

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainUI').style.display = 'block';
            document.getElementById('userAddr').innerText = userAddress;

            const isAdmin = userAddress.toLowerCase() === OWNER_ADDR.toLowerCase();
            document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('accountType').innerText = i18n[currentLang][isAdmin ? 'accAdmin' : 'accStudent'];

            await syncData();
            log("Session initialized for " + userAddress.substring(0, 10) + "...");
        } catch (e) { log(e.message); }
    }

    async function handleTx(contractObj, actionLabel, method, ...args) {
        try {
            log("logWait");
            const tx = await contractObj[method](...args);
            log("logWait", tx.hash);
            await tx.wait();
            log("logSuccess");
            await syncData();
        } catch (e) { log(e.message); }
    }

    document.getElementById('connectBtn').onclick = connect;

    // Transfer ECCYB
    document.getElementById('sendBtn').onclick = () => {
        const to = document.getElementById('targetAddr').value;
        const amt = document.getElementById('targetAmount').value;
        if (ethers.isAddress(to) && amt) handleTx(contract, 'transferTitle', 'transfer', to, ethers.parseUnits(amt, 18));
    };

    // Gas Support (NEW)
    document.getElementById('sendGasBtn').onclick = async () => {
        const to = document.getElementById('gasTargetAddr').value;
        const amt = document.getElementById('gasGiftAmount').value;
        if (ethers.isAddress(to) && amt) {
            try {
                log("logGasSent");
                const tx = await signer.sendTransaction({
                    to: to,
                    value: ethers.parseEther(amt)
                });
                log("logWait", tx.hash);
                await tx.wait();
                log("logSuccess");
                await syncData();
            } catch (e) { log(e.message); }
        }
    };

    // Staking Actions
    document.getElementById('stakeBtn').onclick = async () => {
        const amt = document.getElementById('stakeAmount').value;
        const days = document.getElementById('stakeDays').value;
        if (amt && days) {
            log("Approving staking...");
            const txA = await contract.approve(STAKING_ADDR, ethers.parseUnits(amt, 18));
            await txA.wait();
            handleTx(stakingContract, 'stakeBtn', 'stake', ethers.parseUnits(amt, 18), days);
        }
    };
    document.getElementById('withdrawBtn').onclick = () => handleTx(stakingContract, 'withdrawBtn', 'withdraw');
    document.getElementById('earlyWithdrawBtn').onclick = () => {
        if(confirm("Confirm early withdrawal? Bonus will be lost.")) 
            handleTx(stakingContract, 'earlyWithdrawBtn', 'earlyWithdraw');
    };

    // Admin Token Actions
    document.getElementById('mintBtn').onclick = () => {
        const amt = document.getElementById('mintAmount').value;
        if (amt) handleTx(contract, 'mintBtn', 'mint', userAddress, ethers.parseUnits(amt, 18));
    };
    document.getElementById('burnBtn').onclick = () => {
        const amt = document.getElementById('burnAmount').value;
        if (amt) handleTx(contract, 'burnBtn', 'burn', ethers.parseUnits(amt, 18));
    };
    document.getElementById('approveBtn').onclick = () => {
        const amt = document.getElementById('approveAmt').value;
        if (amt) handleTx(contract, 'approveBtn', 'approve', STAKING_ADDR, ethers.parseUnits(amt, 18));
    };

    document.getElementById('disconnectBtn').onclick = () => location.reload();
    setInterval(() => { if(userAddress) syncData(); }, 20000);
    setLang('en');
</script>
</body>
</html>
