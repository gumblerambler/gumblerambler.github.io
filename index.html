<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ECCYB - Професійна Панель Управління</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 800px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg); padding: 20px; border-radius: 12px; border-left: 5px solid var(--primary); }
        .stat-label { font-size: 0.8em; color: #666; text-transform: uppercase; }
        .stat-value { font-size: 1.4em; font-weight: bold; color: #222; margin-top: 5px; }
        .admin-box { background: #fff4f4; border: 1px solid #ffebeb; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        th { text-align: left; color: #666; padding: 10px; border-bottom: 2px solid #eee; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; word-break: break-all; }
        .tx-link { color: var(--primary); text-decoration: none; font-family: monospace; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        #debug-console { background: #222; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.8em; height: 100px; overflow-y: auto; margin-top: 20px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div>
            <h2 style="margin:0;">ECCYB Гейміфікація</h2>
            <span style="font-size: 0.8em; color: #888;">ZIEIT Academic Token System • BTTC Mainnet</span>
        </div>
        <button id="connectBtn">Підключити Гаманець</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Ваш баланс</div>
            <div id="userBalance" class="stat-value">-- ECCYB</div>
        </div>
        <div class="stat-card" style="border-left-color: var(--success);">
            <div class="stat-label">Статус мережі</div>
            <div id="networkStatus" class="stat-value">Очікування...</div>
        </div>
    </div>

    <div id="adminPanel" class="admin-box" style="display:none;">
        <h3 style="margin-top:0; color: #d93025;">⚒ Панель Викладача</h3>
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; align-items: end;">
            <div>
                <label style="font-size: 0.8em;">Адреса студента</label>
                <input type="text" id="studentAddr" placeholder="0x...">
            </div>
            <div>
                <label style="font-size: 0.8em;">Токени</label>
                <input type="number" id="mintAmount" placeholder="Кількість">
            </div>
            <button id="mintBtn" style="background: var(--success); height: 45px; margin-bottom: 10px;">Нарахувати</button>
        </div>
    </div>

    <h3>📜 Останні операції</h3>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Тип</th>
                <th>Отримувач / Хеш</th>
                <th>Сума</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="3" style="text-align:center; color:#999;">Тут з'являться ваші транзакції</td>
        </tbody>
    </table>

    <div id="debug-console">Система готова. Очікування підключення...</div>
</div>

<script>
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    let contract;

    const log = (msg) => {
        const consoleEl = document.getElementById('debug-console');
        consoleEl.innerHTML += `<br>> [${new Date().toLocaleTimeString()}] ${msg}`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    };

async function init() {
    if (!window.ethereum) return alert("Гаманець не знайдено!");
    
    try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const userAddress = accounts[0];
        log(`Авторизовано: ${userAddress}`);

        // СТВОРЮЄМО ДВА ПРОВАЙДЕРИ
        // 1. Для читання (стабільний RPC BTTC) - йому байдуже на глюки Trust Wallet
        const readProvider = new ethers.JsonRpcProvider("https://rpc.bittorrentchain.io");
        
        // 2. Для підпису (через гаманець)
        const walletProvider = new ethers.BrowserProvider(window.ethereum);
        const signer = await walletProvider.getSigner();

        // Створюємо два екземпляри контракту
        const readContract = new ethers.Contract(CONTRACT_ADDR, ["function balanceOf(address) view returns (uint256)"], readProvider);
        contract = new ethers.Contract(CONTRACT_ADDR, ["function mint(address, uint256) public", "function decimals() view returns (uint8)"], signer);

        // Читаємо баланс через ПРЯМИЙ вузол
        const bal = await readContract.balanceOf(userAddress);
        document.getElementById('userBalance').innerText = `${ethers.formatUnits(bal, 18)} ECCYB`;
        document.getElementById('networkStatus').innerText = "BTTC (через Direct RPC)";
        
        document.getElementById('connectBtn').style.display = 'none';
        if (userAddress.toLowerCase() === OWNER_ADDR.toLowerCase()) {
            document.getElementById('adminPanel').style.display = 'block';
        }
        log("Дані успішно отримано (Hybrid Mode)");

    } catch (e) { 
        log("Помилка: " + e.message); 
    }
}

    async function mint() {
        const to = document.getElementById('studentAddr').value;
        const amt = document.getElementById('mintAmount').value;
        if(!to || !amt) return;

        try {
            log(`Відправка транзакції на ${to}...`);
            const tx = await contract.mint(to, ethers.parseUnits(amt, 18));
            log(`Транзакція в мережі: ${tx.hash}`);
            
            addHistoryRow("MINT", tx.hash, amt);
            
            await tx.wait();
            log("Транзакція ПІДТВЕРДЖЕНА!");
            alert("Токени успішно нараховано!");
        } catch (e) { log("Помилка транзакції: " + e.message); }
    }

    function addHistoryRow(type, hash, amount) {
        const tbody = document.querySelector("#historyTable tbody");
        if(tbody.innerText.includes("Тут з'являться")) tbody.innerHTML = "";
        
        const row = `<tr>
            <td><span style="color:green; font-weight:bold;">${type}</span></td>
            <td><a href="https://bttcscan.com/tx/${hash}" target="_blank" class="tx-link">${hash.substring(0,20)}...</a></td>
            <td><b>${amount} ECCYB</b></td>
        </tr>`;
        tbody.innerHTML = row + tbody.innerHTML;
    }

    document.getElementById('connectBtn').onclick = init;
    document.getElementById('mintBtn').onclick = mint;
</script>

</body>
</html>
