<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB - Academic Ledger (Strict Precision)</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --academic-blue: #003366;
            --academic-gray: #f4f4f4;
            --text-main: #222;
            --border-color: #ccc;
            --success-color: #28a745;
            --danger-color: #a4161a;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #fff;
            color: var(--text-main);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 5px 5px 0px #eee;
        }

        header {
            border-bottom: 2px solid var(--academic-blue);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1, h2, h3 { color: var(--academic-blue); margin: 0 0 10px 0; text-transform: uppercase; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }

        .metric-card { border: 1px solid var(--border-color); padding: 15px; background: var(--academic-gray); }

        .metric-label { font-variant: small-caps; font-weight: bold; font-size: 0.9em; display: block; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; }

        .metric-value { font-family: Arial, sans-serif; font-size: 1.3em; font-weight: bold; }

        .control-panel { border: 2px solid var(--academic-blue); padding: 20px; margin: 20px 0; background-color: #fcfcfc; }

        .input-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        input { padding: 10px; border: 1px solid var(--border-color); flex: 1; font-family: Arial, sans-serif; min-width: 200px; }

        .btn { border: none; padding: 10px 20px; cursor: pointer; font-variant: small-caps; font-weight: bold; color: white; transition: 0.2s; background-color: var(--academic-blue); }
        .btn:hover { opacity: 0.9; }
        .btn-mint { background-color: var(--success-color); }
        .btn-burn { background-color: var(--danger-color); }
        .btn-export { background-color: #555; font-size: 0.8em; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-family: Arial, sans-serif; font-size: 0.85em; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: left; }
        th { background-color: var(--academic-gray); }

        #terminal { background-color: #222; color: #00ff00; padding: 10px; font-family: "Courier New", monospace; font-size: 0.8em; height: 100px; overflow-y: auto; margin-top: 20px; border: 1px inset #000; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Academic Ledger System</h1>
            <p>Monetary Simulation • Economic Cybernetics (ZIEIT)</p>
        </div>
        <button id="connectBtn" class="btn">Authorize Session</button>
    </header>

    <div class="grid">
        <div class="metric-card">
            <span class="metric-label">Circulating ECCYB</span>
            <div id="userBalance" class="metric-value">0.00</div>
        </div>
        <div class="metric-card">
            <span class="metric-label">Operational BTT</span>
            <div id="bttBalance" class="metric-value">0.00</div>
        </div>
        <div class="metric-card">
            <span class="metric-label">Ledger Status</span>
            <div id="networkName" class="metric-value">Offline</div>
        </div>
    </div>

    <div id="adminSection" class="control-panel" style="display: none;">
        <h3>Monetary Policy Control</h3>
        <div class="input-group">
            <input type="text" id="targetAddr" placeholder="Target Address (0x...)">
            <input type="number" id="tokenAmt" step="0.01" placeholder="Quantity (e.g. 10.50)">
            <button id="mintBtn" class="btn btn-mint">Issue (Mint)</button>
            <button id="burnBtn" class="btn btn-burn">Revoke (Burn)</button>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
        <h3>Consolidated Registry</h3>
        <button id="exportBtn" class="btn btn-export">Export CSV Report</button>
    </div>
    
    <table id="historyTable">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Operation</th>
                <th>Hash Reference</th>
                <th>Amount (ECCYB)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="terminal">System Ready. Awaiting Handshake...</div>
</div>

<script>
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    let provider, signer, contract;

    const log = (msg) => {
        const t = document.getElementById('terminal');
        t.innerHTML += `<br>> [${new Date().toLocaleTimeString()}] ${msg}`;
        t.scrollTop = t.scrollHeight;
    };

    function saveSession(entry) {
        let logs = JSON.parse(localStorage.getItem('eccyb_logs') || '[]');
        logs.push(entry);
        localStorage.setItem('eccyb_logs', JSON.stringify(logs));
        renderTable();
    }

    function renderTable() {
        const tbody = document.querySelector("#historyTable tbody");
        let logs = JSON.parse(localStorage.getItem('eccyb_logs') || '[]');
        tbody.innerHTML = logs.reverse().map(e => `
            <tr>
                <td>${e.time}</td>
                <td style="color:${e.type === 'MINT' ? 'green' : 'red'}; font-weight:bold;">${e.type}</td>
                <td><small>${e.hash.substring(0,30)}...</small></td>
                <td>${parseFloat(e.value).toFixed(2)}</td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;">No session data found.</td></tr>';
    }

    async function init() {
        if (!window.ethereum) return alert("Web3 Provider Missing.");
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        const address = await signer.getAddress();
        
        document.getElementById('networkName').innerText = "BTTC Mainnet";
        document.getElementById('connectBtn').style.display = 'none';

        contract = new ethers.Contract(CONTRACT_ADDR, [
            "function balanceOf(address) view returns (uint256)",
            "function mint(address, uint256) public",
            "function burn(address, uint256) public"
        ], signer);

        if (address.toLowerCase() === OWNER_ADDR.toLowerCase()) {
            document.getElementById('adminSection').style.display = 'block';
        }
        
        updateMetrics(address);
        renderTable();
        log("Synchronization complete.");
    }

    async function updateMetrics(address) {
        const bal = await contract.balanceOf(address);
        // Rounding to 2 decimal places for Academic display
        document.getElementById('userBalance').innerText = parseFloat(ethers.formatUnits(bal, 18)).toFixed(2);
        
        const bttWei = await provider.getBalance(address);
        document.getElementById('bttBalance').innerText = parseFloat(ethers.formatEther(bttWei)).toFixed(4);
    }

    async function handleAction(type) {
        const to = document.getElementById('targetAddr').value;
        const amt = document.getElementById('tokenAmt').value;
        if(!to || !amt) return alert("Fields cannot be empty.");
        
        try {
            log(`Executing ${type} operation...`);
            const tx = type === 'MINT' 
                ? await contract.mint(to, ethers.parseUnits(amt, 18))
                : await contract.burn(to, ethers.parseUnits(amt, 18));
            
            await tx.wait();
            saveSession({ time: new Date().toLocaleString(), type, hash: tx.hash, value: amt });
            updateMetrics(await signer.getAddress());
            log(`${type} Sequence Success.`);
        } catch (e) { log(`Error: ${e.message}`); }
    }

    function exportCSV() {
        let logs = JSON.parse(localStorage.getItem('eccyb_logs') || '[]');
        if(logs.length === 0) return alert("Empty registry.");
        // Ensure values in CSV are formatted correctly
        let csv = "Timestamp,Operation,Hash,Amount\n" + logs.map(e => `${e.time},${e.type},${e.hash},${parseFloat(e.value).toFixed(2)}`).join("\n");
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'Academic_Ledger_Report.csv';
        a.click();
    }

    document.getElementById('connectBtn').onclick = init;
    document.getElementById('mintBtn').onclick = () => handleAction('MINT');
    document.getElementById('burnBtn').onclick = () => handleAction('BURN');
    document.getElementById('exportBtn').onclick = exportCSV;

    window.onload = renderTable;
</script>
</body>
</html>
