<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB | Digital Economy System</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --u-blue: #003366;
            --u-text: #2c3e50;
            --u-bg: #f4f4f2;
            --u-white: #ffffff;
            --u-border: #d1d1d1;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--u-bg);
            color: var(--u-text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--u-white);
            max-width: 650px;
            width: 100%;
            padding: 40px;
            border: 1px solid var(--u-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .lang-btn {
            background: none;
            border: 1px solid var(--u-blue);
            color: var(--u-blue);
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .lang-btn.active {
            background: var(--u-blue);
            color: white;
        }

        header {
            text-align: center;
            border-bottom: 2px double var(--u-blue);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 { font-size: 1.8rem; margin: 0; color: var(--u-blue); text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-style: italic; font-size: 0.9rem; color: #666; }

        .balance-card {
            background: var(--u-bg);
            border: 1px solid var(--u-border);
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        #userBalance { font-size: 2.2rem; color: var(--u-blue); margin: 10px 0; }

        .panel { text-align: left; margin-top: 30px; padding: 20px; border: 1px solid var(--u-border); }
        h3 { font-size: 1.1rem; border-bottom: 1px solid var(--u-blue); padding-bottom: 5px; margin-bottom: 15px; color: var(--u-blue); }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--u-border); font-family: 'Courier New', monospace; box-sizing: border-box; }

        button.main-btn {
            background-color: var(--u-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-outline { background: transparent; color: var(--u-blue); border: 1px solid var(--u-blue); width: 100%; padding: 10px; cursor: pointer; margin-top: 5px; }
        .btn-burn { background-color: #5d0000; color: white; border: none; width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; }

        #console {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            height: 120px;
            overflow-y: auto;
            margin-top: 30px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switch">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ua" onclick="setLang('ua')">UA</button>
    </div>

    <header>
        <h1 data-key="title">ECCYB System</h1>
        <div class="subtitle" data-key="subtitle">Digital Economy & Information Technologies | BTTC Network</div>
    </header>

    <div id="authSection">
        <button class="main-btn" id="connectBtn" data-key="connectBtn">Initialize Session (MetaMask)</button>
    </div>

    <div id="mainUI" style="display:none;">
        <div class="balance-card">
            <div id="accountType" data-key="accType" style="font-size: 0.7rem; font-weight: bold; color: #777;">ACCOUNT TYPE</div>
            <div id="userBalance">-- ECCYB</div>
            <div id="userAddr" style="font-size: 0.7rem; font-family: monospace; color: #999;"></div>
        </div>

        <div class="panel">
            <h3 data-key="transferTitle">Internal Asset Transfer</h3>
            <div class="input-group">
                <label data-key="labelAddr">Recipient Address</label>
                <input type="text" id="targetAddr" placeholder="0x...">
            </div>
            <div class="input-group">
                <label data-key="labelAmt">Token Amount</label>
                <input type="number" id="targetAmount" placeholder="0.00">
            </div>
            <button class="main-btn" id="sendBtn" data-key="sendBtn">Execute Transaction</button>
        </div>

        <div id="adminPanel" class="panel" style="display:none; border-color: #a3c1ad;">
            <h3 data-key="adminTitle">Emission Management (Administrator)</h3>
            <div class="input-group">
                <label data-key="labelMint">Minting Volume</label>
                <input type="number" id="mintAmount" placeholder="Amount">
                <button class="btn-outline" id="mintBtn" data-key="mintBtn">Activate Emission</button>
            </div>
            <div class="input-group" style="margin-top:20px;">
                <label data-key="labelBurn">Asset Destruction (Burn)</label>
                <input type="number" id="burnAmount" placeholder="Amount">
                <button class="btn-burn" id="burnBtn" data-key="burnBtn">Burn Tokens</button>
            </div>
        </div>

        <button class="btn-outline" id="disconnectBtn" data-key="exitBtn" style="margin-top: 20px;">Terminate Session</button>
    </div>

    <div id="console" data-key="consoleInit">System awaiting blockchain connection...</div>
</div>
