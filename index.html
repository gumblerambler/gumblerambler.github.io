<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCYB - Повний Дашборд Управління</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --danger: #d93025; --success: #188038; --bg: #f8f9fa; --burn: #424242; --mint: #673ab7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; color: #333; }
        .dashboard { background: white; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 30px; text-align: center; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 25px; border-radius: 15px; margin-bottom: 25px; }
        .status-bar { font-size: 0.85em; color: #666; margin-bottom: 15px; word-break: break-all; font-family: monospace; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; color: white; margin-top: 5px; }
        #connectBtn { background: var(--primary); width: 100%; }
        #disconnectBtn { background: #6c757d; font-size: 0.8em; }
        .admin-panel { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; }
        .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        #console { background: #222; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.75em; text-align: left; height: 100px; overflow-y: auto; margin-top: 20px; }
        h4 { margin: 0 0 10px 0; font-size: 0.9em; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <div style="text-align: left;">
            <h2 style="margin:0; color: var(--primary);">ECCYB</h2>
            <span style="font-size: 0.75em; color: #888;">ZIEIT Academic System</span>
        </div>
        <button id="disconnectBtn" style="display:none;">Вийти</button>
    </div>

    <div id="status" class="status-bar">Очікування MetaMask...</div>

    <div class="balance-box">
        <div style="font-size: 0.8em; opacity: 0.9;">БАЛАНС АДМІНІСТРАТОРА</div>
        <div id="userBalance" style="font-size: 2.5em; font-weight: bold;">-- ECCYB</div>
    </div>

    <button id="connectBtn">Підключити Гаманець</button>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <h3 style="color: var(--danger); margin-top: 0;">⚒ ПАНЕЛЬ УПРАВЛІННЯ</h3>
        
        <div class="section">
            <h4 style="color: var(--mint);">✨ Емісія (Mint)</h4>
            <label style="font-size: 0.8em;">Кількість нових балів:</label>
            <input type="number" id="mintAmount" placeholder="Наприклад: 1000">
            <button id="mintBtn" style="background: var(--mint); width: 100%;">Створити токени</button>
        </div>

        <div class="section">
            <h4 style="color: var(--success);">💸 Розподіл (Transfer)</h4>
            <input type="text" id="studentAddr" placeholder="Адреса студента 0x...">
            <input type="number" id="sendAmount" placeholder="Сума переказу">
            <button id="sendBtn" style="background: var(--success); width: 100%;">Відправити студенту</button>
        </div>

        <div class="section">
            <h4 style="color: var(--burn);">🔥 Утилізація (Burn)</h4>
            <input type="number" id="burnAmount" placeholder="Кількість для знищення">
            <button id="burnBtn" style="background: var(--burn); width: 100%;">Спалити токени</button>
        </div>
    </div>

    <div id="console">Готовність системи...</div>
</div>

<script>
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    
    const ECCYB_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address, uint256) public returns (bool)",
        "function mint(address, uint256) public",
        "function burn(uint256) public",
        "function decimals() view returns (uint8)"
    ];

    let signer, contract, userAddress;

    const log = (msg) => {
        const c = document.getElementById('console');
        c.innerHTML += `<br>> ${msg}`;
        c.scrollTop = c.scrollHeight;
    };

    async function updateUI() {
        const bal = await contract.balanceOf(userAddress);
        document.getElementById('userBalance').innerText = `${Math.floor(Number(ethers.formatUnits(bal, 18)))} ECCYB`;
    }

    async function connect() {
        if (!window.ethereum) return alert("MetaMask не знайдено!");
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDR, ECCYB_ABI, signer);

            document.getElementById('status').innerText = `Адреса: ${userAddress}`;
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('disconnectBtn').style.display = 'block';

            if (userAddress.toLowerCase() === OWNER_ADDR.toLowerCase()) {
                document.getElementById('adminPanel').style.display = 'block';
                log("Авторизовано як Головний Адміністратор.");
            }

            await updateUI();
            log("Дані синхронізовано.");
        } catch (e) { log("Помилка: " + e.message); }
    }

    // МІНТ
    async function handleMint() {
        const amt = document.getElementById('mintAmount').value;
        if (!amt || amt <= 0) return alert("Введіть кількість!");
        try {
            log(`✨ Спроба емісії ${amt} ECCYB...`);
            const tx = await contract.mint(userAddress, ethers.parseUnits(amt, 18));
            await tx.wait();
            log("Емісія успішна! Баланс оновлено.");
            await updateUI();
        } catch (e) { log("Помилка мінту: " + e.message); }
    }

    // ТРАНСФЕР
    async function handleTransfer() {
        const to = document.getElementById('studentAddr').value;
        const amt = document.getElementById('sendAmount').value;
        if (!ethers.isAddress(to) || !amt) return alert("Перевірте адресу та суму!");
        try {
            log("Відправка транзакції...");
            const tx = await contract.transfer(to, ethers.parseUnits(amt, 18));
            await tx.wait();
            log("Переказ успішний!");
            await updateUI();
        } catch (e) { log("Помилка переказу: " + e.message); }
    }

    // БЕРН
    async function handleBurn() {
        const amt = document.getElementById('burnAmount').value;
        if (!amt) return;
        try {
            log("🔥 Процес спалювання...");
            const tx = await contract.burn(ethers.parseUnits(amt, 18));
            await tx.wait();
            log("Токени знищено.");
            await updateUI();
        } catch (e) { log("Помилка: " + e.message); }
    }

    function disconnect() {
        signer = null; contract = null;
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('disconnectBtn').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('userBalance').innerText = "-- ECCYB";
        log("Сесію закрито.");
    }

    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('disconnectBtn').onclick = disconnect;
    document.getElementById('mintBtn').onclick = handleMint;
    document.getElementById('sendBtn').onclick = handleTransfer;
    document.getElementById('burnBtn').onclick = handleBurn;
</script>
</body>
</html>
