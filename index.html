<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ECCYB - Панель ZIEIT (MetaMask Optimized)</title>
    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --danger: #d93025; --success: #188038; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .dashboard { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 25px; text-align: center; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-box { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .status-bar { font-size: 0.85em; color: #666; margin-bottom: 15px; word-break: break-all; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        #connectBtn { background: var(--primary); color: white; width: 100%; }
        #disconnectBtn { background: #6c757d; color: white; font-size: 0.8em; }
        .admin-panel { background: #fff4f4; border: 1px solid #ffe2e2; padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; }
        #console { background: #222; color: #0f0; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.75em; text-align: left; height: 80px; overflow-y: auto; margin-top: 20px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h3 style="margin:0;">ECCYB Гейміфікація</h3>
        <button id="disconnectBtn" style="display:none;">Вийти</button>
    </div>

    <div id="status" class="status-bar">Гаманець не підключено</div>

    <div class="balance-box">
        <div style="font-size: 0.9em; opacity: 0.8;">Мій баланс</div>
        <div id="userBalance" style="font-size: 2em; font-weight: bold;">-- ECCYB</div>
    </div>

    <button id="connectBtn">Підключити MetaMask</button>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <strong style="color: var(--danger);">⚒ Панель викладача (Mint)</strong>
        <input type="text" id="studentAddr" placeholder="Адреса студента 0x...">
        <input type="number" id="mintAmount" placeholder="Кількість токенів">
        <button id="mintBtn" style="background: var(--success); color: white; width: 100%;">Нарахувати токени</button>
    </div>

    <div id="console">Система готова. Очікування підключення...</div>
</div>

<script>
    const CONTRACT_ADDR = "0x4aa97493d7c8e570a548549222d21e91aa6c60ca";
    const OWNER_ADDR = "0xf08b28c6d8a26cd1a24d1dbc95c89005f1e04ead";
    
    // ОСЬ ТУТ МИ ВИЗНАЧАЄМО ABI
    const ECCYB_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function mint(address, uint256) public",
        "function decimals() view returns (uint8)"
    ];

    let signer, contract;

    const log = (msg) => {
        const c = document.getElementById('console');
        c.innerHTML += `<br>> ${msg}`;
        c.scrollTop = c.scrollHeight;
    };

    async function connect() {
        if (!window.ethereum) return alert("Встановіть MetaMask!");
        
        try {
            log("Запит до MetaMask...");
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const address = accounts[0];

            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            
            // Використовуємо визначений ABI
            contract = new ethers.Contract(CONTRACT_ADDR, ECCYB_ABI, signer);

            // Оновлення інтерфейсу
            document.getElementById('status').innerText = `Підключено: ${address}`;
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('disconnectBtn').style.display = 'block';

            if (address.toLowerCase() === OWNER_ADDR.toLowerCase()) {
                document.getElementById('adminPanel').style.display = 'block';
                log("Доступ викладача підтверджено");
            }

            const formattedBalance = Math.floor(Number(ethers.formatUnits(bal, 18)));
            document.getElementById('userBalance').innerText = `${formattedBalance} ECCYB`;
            log("Дані завантажено успішно");

        } catch (e) {
            log("Помилка входу: " + e.message);
        }
    }

    function disconnect() {
        signer = null;
        contract = null;
        document.getElementById('status').innerText = "Гаманець не підключено";
        document.getElementById('userBalance').innerText = "-- ECCYB";
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('disconnectBtn').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        log("Сесію завершено");
    }

    async function handleMint() {
        const to = document.getElementById('studentAddr').value;
        const amt = document.getElementById('mintAmount').value;
        if (!to || !amt) return alert("Заповніть всі поля!");

        try {
            log("Відправка транзакції...");
            const tx = await contract.mint(to, ethers.parseUnits(amt, 18));
            log(`Хеш: ${tx.hash.substring(0, 20)}...`);
            await tx.wait();
            log("УСПІХ! Токени нараховано.");
            alert("Бонуси студенту нараховано успішно!");
        } catch (e) {
            log("Помилка мінту: " + e.message);
        }
    }

    document.getElementById('connectBtn').onclick = connect;
    document.getElementById('disconnectBtn').onclick = disconnect;
    document.getElementById('mintBtn').onclick = handleMint;
</script>

</body>
</html>
